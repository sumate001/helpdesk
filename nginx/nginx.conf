events {
    worker_connections 1024;
}

http {
    # Docker embedded DNS — resolve ชื่อ service ใหม่ทุก 10 วิ
    # (ไม่ใช้ upstream/ชื่อตรงใน proxy_pass เพราะ nginx จะ resolve ครั้งเดียวตอน start
    #  แล้วค้าง IP เดิม — พอ rebuild คอนเทนเนอร์ได้ IP ใหม่จะกลายเป็น 502 จนกว่าจะ restart nginx)
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # ต้องเป็นตัวแปร nginx ถึงจะ resolve ตอน request (ดูคอมเมนต์ resolver ด้านบน)
        set $backend_up http://backend:8000;
        set $frontend_up http://frontend:80;

        client_max_body_size 20m;
        server_tokens off;

        # Security headers (ใส่ที่ proxy ชั้นนอกให้ครอบทุก response)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self)" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # API + webhook → backend
        location /api/ {
            proxy_pass $backend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /webhook/ {
            proxy_pass $backend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Line-Signature $http_x_line_signature;
        }
        location /health {
            proxy_pass $backend_up;
        }

        # ทุกอย่างที่เหลือ → frontend SPA
        location / {
            proxy_pass $frontend_up;
            proxy_set_header Host $host;
            # frontend nginx ตั้ง header ชุดเดียวกันไว้แล้ว — ซ่อนกัน header ซ้ำสองชั้น
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            proxy_hide_header Cross-Origin-Resource-Policy;
        }
    }
}
