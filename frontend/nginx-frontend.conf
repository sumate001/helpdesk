server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://profile.line-scdn.net; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self)" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # กันไฟล์ metadata/dotfile หลุด (Dockerfile, package.json, .env ฯลฯ)
    location ~ /\. { deny all; }
    location ~* ^/(dockerfile|package(-lock)?\.json|vite\.config\.js|tailwind\.config\.js|postcss\.config\.js)$ {
        deny all;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
